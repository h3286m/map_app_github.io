<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%">
  <defs>
    <pattern id="grid-outdoor" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#d5decb" stroke-width="1"/>
    </pattern>
    <linearGradient id="grass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8f3e5"/>
      <stop offset="100%" stop-color="#d6ebd1"/>
    </linearGradient>
    <linearGradient id="track" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e07a5f"/>
      <stop offset="100%" stop-color="#d9534f"/>
    </linearGradient>
  </defs>

  <!-- Ground Background -->
  <rect width="1000" height="700" fill="url(#grass)" />
  <rect width="1000" height="700" fill="url(#grid-outdoor)" opacity="0.6"/>

  <!-- Outer Boundary Wall -->
  <rect x="50" y="50" width="900" height="600" fill="none" stroke="#4a5568" stroke-width="6" stroke-dasharray="12 6" rx="20"/>

  <!-- Outdoor Fan Plaza / Stadium Field -->
  <g id="stadium-field">
    <!-- Running Track -->
    <rect x="150" y="120" width="700" height="240" rx="120" fill="url(#track)" stroke="#c0392b" stroke-width="4"/>
    <!-- Pitch Grass -->
    <rect x="230" y="150" width="540" height="180" rx="40" fill="#2ecc71" stroke="#ffffff" stroke-width="3"/>
    <!-- Field Marking -->
    <line x1="500" y1="150" x2="500" y2="330" stroke="#ffffff" stroke-width="2"/>
    <circle cx="500" cy="240" r="45" fill="none" stroke="#ffffff" stroke-width="2"/>
    <rect x="230" y="190" width="80" height="100" fill="none" stroke="#ffffff" stroke-width="2"/>
    <rect x="690" y="190" width="80" height="100" fill="none" stroke="#ffffff" stroke-width="2"/>
  </g>

  <!-- Logistics & Parking Bay -->
  <g id="logistics-bay">
    <rect x="150" y="420" width="700" height="200" rx="15" fill="#e2e8f0" stroke="#94a3b8" stroke-width="3"/>
    <!-- Parking Lines -->
    <line x1="200" y1="440" x2="200" y2="520" stroke="#cbd5e1" stroke-width="3"/>
    <line x1="260" y1="440" x2="260" y2="520" stroke="#cbd5e1" stroke-width="3"/>
    <line x1="320" y1="440" x2="320" y2="520" stroke="#cbd5e1" stroke-width="3"/>
    <line x1="380" y1="440" x2="380" y2="520" stroke="#cbd5e1" stroke-width="3"/>
    <line x1="440" y1="440" x2="440" y2="520" stroke="#cbd5e1" stroke-width="3"/>
    <text x="500" y="580" font-size="22" font-weight="bold" fill="#64748b" text-anchor="middle">車両搬入・物流駐車場エリア (LOGISTICS DOCK)</text>
  </g>

  <!-- Gates & Entrances -->
  <g id="gates">
    <!-- North Gate -->
    <rect x="420" y="40" width="160" height="20" fill="#3b82f6" rx="5"/>
    <text x="500" y="34" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">▲ 北側メインゲート (NORTH GATE)</text>

    <!-- South Gate -->
    <rect x="420" y="640" width="160" height="20" fill="#ef4444" rx="5"/>
    <text x="500" y="680" font-size="16" font-weight="bold" fill="#991b1b" text-anchor="middle">▼ 南側緊急搬入ゲート (SOUTH GATE)</text>
  </g>

  <!-- Title Watermark -->
  <text x="80" y="90" font-size="28" font-weight="900" fill="#334155" opacity="0.4">OUTDOOR MAP / 屋外広場</text>
</svg>
