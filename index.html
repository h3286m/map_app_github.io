<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>オフライン多機能会場マップ (ACP・部屋・ゾーン連動)</title>
  <link rel="stylesheet" href="css/styles.css?v=18.0">
  <style>
    /* 多機能オフライン会場マップ - 完全統合レスポンシブスタイル */
    :root {
      --primary: #007aff;
      --primary-hover: #0056b3;
      --accent-acp: #06b6d4;
      --accent-zone: #af52de;
      --bg-color: #0f172a;
      --panel-bg: rgba(30, 41, 59, 0.95);
      --panel-border: rgba(255, 255, 255, 0.1);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --card-bg: #1e293b;
      --card-hover: #334155;
      --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
      --radius: 12px;
    }

    body.light-theme {
      --bg-color: #f4f6f8;
      --panel-bg: rgba(255, 255, 255, 0.95);
      --panel-border: rgba(0, 0, 0, 0.1);
      --text-primary: #0f172a;
      --text-secondary: #64748b;
      --card-bg: #ffffff;
      --card-hover: #f1f5f9;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      height: 100dvh; /* スマホブラウザのアドレスバー考慮 */
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color); color: var(--text-primary);
      display: flex; flex-direction: column;
    }

    body > input[type="radio"], body > input[type="checkbox"] {
      display: none !important; position: absolute !important; opacity: 0 !important; pointer-events: none !important; width: 0 !important; height: 0 !important;
    }

    .modal-card input[type="radio"], .modal-card input[type="checkbox"] {
      display: inline-block !important; margin-right: 4px;
    }

    /* --- ヘッダー操作パネル --- */
    .control-panel {
      background: var(--panel-bg); backdrop-filter: blur(12px);
      padding: 8px 14px;
      border-bottom: 1px solid var(--panel-border);
      z-index: 40; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      display: flex; flex-direction: column; gap: 6px;
      flex-shrink: 0;
    }

    .header-row-1 {
      display: flex; justify-content: space-between; align-items: center;
      gap: 8px; flex-wrap: wrap;
    }

    .floor-tabs { display: flex; gap: 4px; background: rgba(0, 0, 0, 0.25); padding: 3px; border-radius: 8px; flex-shrink: 0; }
    .tab-btn { padding: 5px 12px; border-radius: 6px; font-size: 12px; font-weight: 700; cursor: pointer; color: var(--text-secondary); transition: all 0.2s ease; user-select: none; }
    .tab-btn:hover { color: var(--text-primary); }

    .layer-menu { display: flex; gap: 4px; font-size: 11px; align-items: center; }
    .layer-menu label { cursor: pointer; padding: 5px 9px; background: var(--card-bg); color: var(--text-secondary); border-radius: 6px; border: 1px solid var(--panel-border); white-space: nowrap; font-weight: 600; display: flex; align-items: center; gap: 3px; transition: all 0.2s ease; user-select: none; }
    .layer-menu label:hover { background: var(--card-hover); }

    .header-row-2 {
      display: flex; gap: 4px; align-items: center; flex-wrap: wrap;
    }

    .btn-primary { padding: 5px 11px; background: var(--primary); color: #fff; border: none; border-radius: 6px; font-weight: 700; font-size: 11px; cursor: pointer; transition: background 0.2s; white-space: nowrap; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { padding: 5px 9px; background: var(--card-hover); color: var(--text-primary); border: 1px solid var(--panel-border); border-radius: 6px; font-weight: 600; font-size: 11px; cursor: pointer; white-space: nowrap; }

    .search-filter-row { display: flex; gap: 6px; align-items: center; }
    .search-box-wrap { position: relative; flex: 1; }
    .search-input { width: 100%; padding: 6px 10px 6px 28px; border-radius: 6px; border: 1px solid var(--panel-border); background: var(--card-bg); color: var(--text-primary); font-size: 12px; outline: none; }
    .search-input:focus { border-color: var(--primary); }
    .search-icon { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); color: var(--text-secondary); pointer-events: none; font-size: 12px; }
    .dept-select { padding: 6px 8px; border-radius: 6px; border: 1px solid var(--panel-border); background: var(--card-bg); color: var(--text-primary); font-size: 11px; font-weight: 600; outline: none; cursor: pointer; max-width: 150px; }

    /* --- マップ表示エリア --- */
    .map-viewport { position: relative; flex: 1; background: #0b1120; overflow: hidden; touch-action: none; cursor: grab; }
    .map-viewport:active { cursor: grabbing; }

    .map-container { position: absolute; top: 0; left: 0; transform-origin: 0 0; transition: transform 0.05s linear; }
    .floor-map { position: absolute; top: 0; left: 0; display: none; }
    #map-outdoor { width: 1024px; height: 585px; }
    #map-1f { width: 1024px; height: 718px; }
    #map-2f { width: 1024px; height: 678px; }
    .floor-map img.bg-svg { width: 100%; height: 100%; object-fit: fill; pointer-events: none; user-select: none; display: block; }

    .zoom-controls { position: absolute; right: 12px; top: 12px; z-index: 35; display: flex; flex-direction: column; gap: 6px; }
    .zoom-btn { width: 34px; height: 34px; background: var(--panel-bg); border: 1px solid var(--panel-border); color: var(--text-primary); border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); backdrop-filter: blur(8px); }

    .room-pin-container, .acp-pin-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }

    /* 📍 部屋（ルーム）枠 & ピン */
    .room-pin {
      position: absolute !important;
      pointer-events: auto !important;
      transform: translate(-50%, -50%) !important;
      cursor: pointer !important;
      z-index: 20 !important;
      user-select: none !important;
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      justify-content: center !important;
      box-sizing: border-box !important;
      border-style: solid !important;
      border-width: 1.5px !important;
      border-radius: 4px !important;
      overflow: visible !important; /* 枠が小さくても中の文字やピンが切れないよう保証 */
      transition: box-shadow 0.2s, background 0.2s !important;
    }
    .room-pin:hover {
      z-index: 920 !important;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.8), inset 0 0 10px rgba(56, 189, 248, 0.25) !important;
    }
    .room-pin-center-mark {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      line-height: 1;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.9));
      pointer-events: none;
      flex-shrink: 0;
    }
    /* 📍 部屋番号ラベル: 常時表示を完全廃止し、ホバー（PC）または選択時（スマホ/タップ）のみ表示 */
    .room-pin-code-text {
      display: none !important;
      position: absolute !important;
      top: calc(50% + 9px) !important;
      left: 50% !important;
      transform: translateX(-50%) !important;
      font-size: 11px !important;
      font-weight: 800 !important;
      color: #ffffff !important;
      background: rgba(15, 23, 42, 0.95) !important;
      border: 1px solid rgba(255, 255, 255, 0.45) !important;
      padding: 1px 6px !important;
      border-radius: 4px !important;
      white-space: nowrap !important;
      line-height: 1.2 !important;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.85) !important;
      pointer-events: none !important;
      letter-spacing: 0.2px !important;
      text-align: center !important;
      z-index: 100 !important;
    }

    /* カーソルオーバー時（PC）、タップ選択時（スマホ/PC）、ドラッグ移動時のみ番号を表示 */
    .room-pin:hover .room-pin-code-text,
    .room-pin.is-selected .room-pin-code-text,
    .room-pin.is-dragging .room-pin-code-text {
      display: block !important;
    }

    .room-pin.is-selected {
      z-index: 900 !important;
      box-shadow: 0 0 0 2px #007aff, 0 0 16px rgba(0, 122, 255, 0.9) !important;
    }

    .room-resize-handle {
      display: none;
      position: absolute;
      right: -5px;
      bottom: -5px;
      width: 10px;
      height: 10px;
      background: #f59e0b;
      border: 1.5px solid #ffffff;
      border-radius: 50%;
      cursor: nwse-resize !important;
      z-index: 110;
      box-shadow: 0 2px 5px rgba(0,0,0,0.5);
    }
    body.editor-active .room-resize-handle { display: block; }
    body.editor-active .room-pin { cursor: move !important; }

    /* ドラッグ中の等倍保持（拡大 scale(1.8) の完全撤廃） */
    .room-pin.is-dragging, .acp-pin.is-dragging {
      cursor: grabbing !important;
      transform: translate(-50%, -50%) !important;
      z-index: 9999 !important;
      opacity: 0.92;
      box-shadow: 0 0 0 2px #f59e0b, 0 4px 12px rgba(0, 0, 0, 0.4) !important;
      transition: none !important;
    }

    /* 🛡️ ACP (Access Control Point) ピン: 重要度・有人無人スタイル */
    .acp-pin {
      position: absolute !important;
      pointer-events: auto !important;
      width: 16px !important;
      height: 16px !important;
      border-radius: 50% !important;
      background: var(--acp-bg, radial-gradient(circle, #22d3ee 0%, #0891b2 100%)) !important;
      border: 2px solid #ffffff !important;
      transform: translate(-50%, -50%) !important;
      box-shadow: 0 0 10px var(--acp-glow, rgba(6, 182, 212, 0.95)), 0 2px 6px rgba(0, 0, 0, 0.8) !important;
      cursor: pointer !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      font-size: 0 !important;
      z-index: 50 !important;
      user-select: none !important;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease !important;
    }
    .acp-pin::after {
      content: '';
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 3px rgba(0, 0, 0, 0.5);
    }
    .acp-pin:hover {
      transform: translate(-50%, -50%) scale(1.25) !important;
      box-shadow: 0 0 16px var(--acp-glow, rgba(6, 182, 212, 1)), 0 0 0 2px #ffffff !important;
      z-index: 920 !important;
    }

    /* 👮 有人・高重要度ACP (人が立つACP): 拡大・二重発光警戒リング */
    .acp-pin.is-manned {
      width: 20px !important;
      height: 20px !important;
      border-width: 2.5px !important;
      z-index: 60 !important;
    }
    .acp-pin.is-manned::after {
      width: 6px;
      height: 6px;
    }
    .acp-pin.is-manned::before {
      content: '';
      position: absolute;
      top: -5px;
      left: -5px;
      right: -5px;
      bottom: -5px;
      border-radius: 50%;
      border: 1.8px dashed rgba(255, 255, 255, 0.9);
      box-shadow: 0 0 8px var(--acp-glow, rgba(245, 158, 11, 0.85));
      animation: acp-manned-ring 5s linear infinite;
      pointer-events: none;
    }
    @keyframes acp-manned-ring {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    body.editor-active .acp-pin {
      cursor: grab !important;
      box-shadow: 0 0 0 2px #f59e0b, 0 0 10px rgba(245, 158, 11, 0.9) !important;
    }

    /* デスクトップ用ツールチップ（横長1行保持） */
    .pin-tooltip {
      position: absolute;
      bottom: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.96);
      color: #fff;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 11px;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transition: all 0.2s ease;
      z-index: 1000;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.15);
      max-width: 320px;
    }
    .room-pin:hover .pin-tooltip, .acp-pin:hover .pin-tooltip {
      opacity: 1; visibility: visible;
      transform: translateX(-50%) translateY(-4px);
    }

    /* --- 詳細情報パネル --- */
    .info-panel {
      background: var(--panel-bg); backdrop-filter: blur(12px);
      padding: 10px 16px;
      border-top: 1px solid var(--panel-border);
      font-size: 13px; color: var(--text-primary);
      flex-shrink: 0; z-index: 35;
      box-shadow: 0 -5px 20px rgba(0,0,0,0.3);
      overflow-y: auto;
    }
    .detail-card { display: flex; flex-direction: column; gap: 6px; }
    .detail-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--panel-border); padding-bottom: 6px; }
    .detail-title { font-size: 15px; font-weight: 800; color: var(--text-primary); display: flex; align-items: center; gap: 6px; }
    .detail-code { font-size: 11px; color: var(--text-secondary); font-family: monospace; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; }
    .badge-acp { background: var(--accent-acp); color: #fff; }
    .badge-dept { background: var(--primary); color: #fff; }
    .detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 6px; }
    .detail-item { background: var(--card-bg); padding: 5px 8px; border-radius: 6px; border: 1px solid var(--panel-border); }
    .detail-item .label { font-size: 10px; color: var(--text-secondary); display: block; }
    .detail-item .value { font-size: 11px; font-weight: 700; color: var(--text-primary); }
    .detail-desc-line { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }

    /* チェックボックス/ラジオボタンスイッチ連動 */
    #tab-outdoor:checked ~ .map-viewport #map-outdoor { display: block; }
    #tab-1f:checked ~ .map-viewport #map-1f { display: block; }
    #tab-2f:checked ~ .map-viewport #map-2f { display: block; }

    #tab-outdoor:checked ~ .control-panel label[for="tab-outdoor"],
    #tab-1f:checked ~ .control-panel label[for="tab-1f"],
    #tab-2f:checked ~ .control-panel label[for="tab-2f"] { background: var(--primary); color: #fff; }

    #layer-room:checked ~ .map-viewport .room-pin-container { display: block; }
    .room-pin-container { display: none; }
    #layer-acp:checked ~ .map-viewport .acp-pin-container { display: block; }
    .acp-pin-container { display: none; }

    #layer-room:checked ~ .control-panel label[for="layer-room"] { background: var(--primary); color: #fff; border-color: var(--primary); }
    #layer-acp:checked ~ .control-panel label[for="layer-acp"] { background: var(--accent-acp); color: #fff; border-color: var(--accent-acp); }

    .modal-backdrop { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(8px); z-index: 9999; display: none; align-items: center; justify-content: center; padding: 16px; }
    .modal-backdrop.open { display: flex; }
    .modal-card { background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 12px; width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; padding: 18px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); color: var(--text-primary); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--panel-border); padding-bottom: 10px; }
    .modal-close { background: none; border: none; color: var(--text-secondary); font-size: 18px; font-weight: bold; cursor: pointer; }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-group label { font-size: 11px; font-weight: 700; color: var(--text-secondary); }
    .form-group input, .form-group select, .form-group textarea { padding: 8px 10px; border-radius: 6px; border: 1px solid var(--panel-border); background: var(--card-bg); color: var(--text-primary); font-size: 13px; outline: none; }

    /* ==========================================================================
       📱 スマホ画面（max-width: 768px）専用 最適化レイアウト
       ========================================================================== */
    @media (max-width: 768px) {
      /* ➀ カーソルオーバー時の縦長ポップアップ（ツールチップ）を完全カット */
      .pin-tooltip {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }

      /* ④ 画面上部コントロールパネルの余白圧縮＆スリム整列 */
      .control-panel {
        padding: 6px 8px !important;
        gap: 5px !important;
      }
      .header-row-1 {
        display: flex !important;
        justify-content: space-between !important;
        align-items: center !important;
        gap: 4px !important;
        flex-wrap: nowrap !important;
      }
      .floor-tabs {
        padding: 2px !important;
        gap: 2px !important;
      }
      .tab-btn {
        padding: 4px 8px !important;
        font-size: 11px !important;
      }
      .layer-menu {
        gap: 3px !important;
      }
      .layer-menu label {
        padding: 4px 7px !important;
        font-size: 11px !important;
        gap: 2px !important;
      }

      .header-row-2 {
        display: flex !important;
        gap: 4px !important;
        align-items: center !important;
        flex-wrap: nowrap !important;
        overflow-x: auto !important;
        scrollbar-width: none !important;
        -webkit-overflow-scrolling: touch !important;
      }
      .header-row-2::-webkit-scrollbar { display: none; }
      .header-row-2 .btn-primary,
      .header-row-2 .btn-secondary {
        padding: 4px 8px !important;
        font-size: 11px !important;
        flex-shrink: 0 !important;
      }

      .search-filter-row {
        gap: 4px !important;
      }
      .search-input {
        padding: 5px 8px 5px 26px !important;
        font-size: 11px !important;
      }
      .dept-select {
        padding: 5px 6px !important;
        font-size: 11px !important;
        max-width: 130px !important;
      }

      /* ③ 画面下レイアウト詳細情報を持ち上げ、スクロール不要で全表示 */
      .info-panel {
        height: auto !important;
        min-height: 125px !important;
        max-height: 38dvh !important;
        padding: 8px 10px !important;
        font-size: 11px !important;
      }
      .detail-header {
        padding-bottom: 4px !important;
      }
      .detail-title {
        font-size: 13px !important;
        gap: 4px !important;
      }
      .detail-code {
        font-size: 9px !important;
      }
      .detail-grid {
        grid-template-columns: repeat(2, 1fr) !important;
        gap: 3px !important;
      }
      .detail-item {
        padding: 3px 5px !important;
      }
      .detail-item .label {
        font-size: 8px !important;
        line-height: 1.1 !important;
      }
      .detail-item .value {
        font-size: 10px !important;
        line-height: 1.2 !important;
      }
      .detail-desc-line {
        font-size: 10px !important;
        margin-top: 2px !important;
        line-height: 1.3 !important;
      }
    }
  </style>
</head>
<body>

  <!-- 状態管理用ラジオ・チェックボックス (CSS Selector連動ロジック) -->
  <input type="radio" id="tab-outdoor" name="floor" checked>
  <input type="radio" id="tab-1f" name="floor">
  <input type="radio" id="tab-2f" name="floor">

  <input type="checkbox" id="layer-room">
  <input type="checkbox" id="layer-acp" checked>

  <!-- ヘッダー・操作コントロールパネル -->
  <div class="control-panel">
    <!-- 行1: フロアタブ ＆ レイヤー切替 -->
    <div class="header-row-1">
      <div class="floor-tabs">
        <label for="tab-outdoor" class="tab-btn" onclick="MapEngine.switchFloor('outdoor')">屋外</label>
        <label for="tab-1f" class="tab-btn" onclick="MapEngine.switchFloor('1f')">1階</label>
        <label for="tab-2f" class="tab-btn" onclick="MapEngine.switchFloor('2f')">2階</label>
      </div>

      <div class="layer-menu">
        <label for="layer-room">📍 部屋</label>
        <label for="layer-acp">🛡️ ACP</label>
      </div>
    </div>

    <!-- 行2: 操作ボタン群 (スリム整列) -->
    <div class="header-row-2">
      <button id="toggle-editor-btn" class="btn-primary" style="background:#f59e0b; color:#000;">✏️ ピン編集</button>
      <button id="export-data-btn" class="btn-secondary" title="編集データを保存・ダウンロード">💾 保存/出力</button>
      <button onclick="if(confirm('ブラウザの保存キャッシュを消去し、初期データ状態に復元しますか？')) DataStorage.reset();" class="btn-secondary" style="color:#ef4444; border-color:rgba(239,68,68,0.5);" title="ブラウザの保存データを初期状態に復元">🔄 復元</button>
      <button id="toggle-theme-btn" class="btn-secondary" title="テーマ切り替え">🌙</button>
    </div>

    <!-- 行3: 検索＆部署フィルター -->
    <div class="search-filter-row">
      <div class="search-box-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" class="search-input" placeholder="部屋名・ACP・コードで即座に検索..." list="search-suggestions">
        <datalist id="search-suggestions"></datalist>
      </div>
      <select id="dept-select" class="dept-select">
        <!-- JSで自動挿入 -->
      </select>
    </div>
  </div>

  <!-- マップ表示エリア (Map Viewport with Pan/Zoom) -->
  <div class="map-viewport">
    <div class="editor-badge">📍 ピン編集モード ON</div>

    <!-- ズーム・パン物理コントロール -->
    <div class="zoom-controls">
      <button id="zoom-in" class="zoom-btn" title="拡大">+</button>
      <button id="zoom-out" class="zoom-btn" title="縮小">−</button>
      <button id="zoom-reset" class="zoom-btn" title="位置リセット" style="font-size:12px;">⟲</button>
    </div>

    <!-- Pan & Zoom Transform Container -->
    <div class="map-container">

      <!-- 屋外マップ -->
      <div id="map-outdoor" class="floor-map">
        <img src="assets/outdoor.png" alt="Outdoor Map" class="bg-svg">
      </div>

      <!-- 1階マップ -->
      <div id="map-1f" class="floor-map">
        <img src="assets/floor1.png" alt="1F Floor Map" class="bg-svg">
      </div>

      <!-- 2階マップ -->
      <div id="map-2f" class="floor-map">
        <img src="assets/floor2.png" alt="2F Floor Map" class="bg-svg">
      </div>

    </div>
  </div>

  <!-- 下部リアルタイム詳細情報パネル (Detail Drawer) -->
  <div class="info-panel" id="info-panel">
    <div class="detail-card">
      <div class="detail-header">
        <div class="detail-title">💡 オフライン会場マップ案内</div>
        <span class="badge badge-dept">OFFLINE ACTIVE</span>
      </div>
      <div style="font-size:13px; color:var(--text-secondary); line-height:1.5; margin-top:4px;">
        マップ上の <b>📍 部屋ピン</b> または <b>🛡️ ACP (アクセスポイント)</b> をタップ/ホバーすると、詳細情報がポップアップおよび画面下に表示されます。<br>
        ヘッダーのレイヤーメニュー（📍 部屋 / 🛡️ ACP）で表示切り替えができます。
      </div>
    </div>
  </div>

  <!-- モーダル1: 部屋・ACPの追加・編集モーダル -->
  <div id="spot-editor-modal" class="modal-backdrop">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="modal-title" style="margin:0; font-size:16px;">📍 部屋・ACPの追加・編集</h3>
        <button id="modal-close-btn" class="modal-close">✕</button>
      </div>
      <form id="spot-form" style="display:flex; flex-direction:column; gap:10px; margin-top:10px;">
        <input type="hidden" id="edit-spot-id">
        
        <div class="form-row">
          <label>種別:</label>
          <div style="display:flex; gap:12px;">
            <label style="cursor:pointer;"><input type="radio" name="spot-type" value="room" checked style="display:inline;"> 📍 部屋</label>
            <label style="cursor:pointer;"><input type="radio" name="spot-type" value="acp" style="display:inline;"> 🛡️ ACP</label>
          </div>
        </div>

        <div class="form-group">
          <label for="form-name">名称 (部屋名 / ACP名): *</label>
          <input type="text" id="form-name" required placeholder="例: 大会本部室, 北側メインゲート">
        </div>

        <div class="form-group">
          <label for="form-code">部屋コード / ACPコード:</label>
          <input type="text" id="form-code" placeholder="例: ADM-01 または ACP-1F-01">
        </div>

        <div class="form-group">
          <label for="form-name-en">英語名称 (任意):</label>
          <input type="text" id="form-name-en" placeholder="例: Protocol Office">
        </div>

        <div class="form-group room-dept-group">
          <label for="form-dept">担当部署:</label>
          <select id="form-dept" style="padding:8px; border-radius:6px; border:1px solid var(--panel-border); background:var(--card-bg); color:var(--text-primary); font-size:13px;"></select>
        </div>

        <div class="form-row" style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;">
          <div class="form-group">
            <label for="form-floor">フロア:</label>
            <select id="form-floor" style="padding:6px; border-radius:6px; border:1px solid var(--panel-border); background:var(--card-bg); color:var(--text-primary);">
              <option value="outdoor">屋外</option>
              <option value="1f">1階</option>
              <option value="2f">2階</option>
            </select>
          </div>
          <div class="form-group">
            <label for="form-x">中心X座標 (%):</label>
            <input type="number" id="form-x" step="0.1" min="0" max="100" required>
          </div>
          <div class="form-group">
            <label for="form-y">中心Y座標 (%):</label>
            <input type="number" id="form-y" step="0.1" min="0" max="100" required>
          </div>
        </div>

        <div class="form-row room-size-row" style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
          <div class="form-group">
            <label for="form-w">枠の横幅 (W %):</label>
            <input type="number" id="form-w" step="0.1" min="1" max="50" value="5.0">
          </div>
          <div class="form-group">
            <label for="form-h">枠の縦幅 (H %):</label>
            <input type="number" id="form-h" step="0.1" min="1" max="50" value="3.5">
          </div>
        </div>

        <!-- ACP専用: 運用形態（有人/無人）・重要度・ドットカラー設定 -->
        <div class="form-group acp-options-group" style="display:none; background:rgba(255,255,255,0.04); padding:10px 12px; border-radius:8px; border:1px solid rgba(255,255,255,0.12);">
          <label style="font-size:12px; font-weight:800; color:var(--text-primary); margin-bottom:8px; display:block;">
            🛡️ ACP運用形態 ＆ 重要度カラー設定:
          </label>
          <div style="display:flex; gap:14px; margin-bottom:10px; flex-wrap:wrap;">
            <label style="cursor:pointer; display:flex; align-items:center; gap:6px; font-size:12px; font-weight:bold; color:#f59e0b;">
              <input type="radio" name="form-acp-manned" value="manned" style="cursor:pointer;"> 👤 有人ACP (人が立つ / スタッフ配置)
            </label>
            <label style="cursor:pointer; display:flex; align-items:center; gap:6px; font-size:12px; color:#38bdf8;">
              <input type="radio" name="form-acp-manned" value="unmanned" checked style="cursor:pointer;"> 無人ACP (人が立たない)
            </label>
          </div>
          <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
            <label for="form-acp-color" style="font-size:11px; color:var(--text-secondary); margin:0;">ドット表示色:</label>
            <div style="display:flex; align-items:center; gap:6px;">
              <input type="color" id="form-acp-color" value="#06b6d4" style="width:34px; height:28px; border:1px solid rgba(255,255,255,0.2); border-radius:4px; cursor:pointer; background:none; padding:1px;">
              <select id="form-acp-color-preset" style="padding:4px 8px; font-size:11px; border-radius:4px; background:var(--card-bg); color:var(--text-primary); border:1px solid var(--panel-border);">
                <option value="#06b6d4">🩵 サイバーシアン (無人)</option>
                <option value="#f59e0b">🟡 アンバーゴールド (有人・スタッフ配置)</option>
                <option value="#ef4444">🔴 ビビッドレッド (最重要・厳戒)</option>
                <option value="#a855f7">🟣 パープル (VIP・要人専用)</option>
                <option value="#10b981">🟢 エメラルド (一般開放)</option>
                <option value="custom">🎨 カラーピッカーで自由指定</option>
              </select>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="form-acp-select">ACP通行許可レベル / アクセス権限 (プルダウン選択):</label>
          <select id="form-acp-select" style="padding:8px 10px; border-radius:6px; border:1px solid var(--panel-border); background:var(--card-bg); color:var(--text-primary); font-size:13px;">
            <option value="Level 1 (競技エリア / FOP・選手・役員)">Level 1 (競技エリア / FOP・選手・役員)</option>
            <option value="Level 2 (選手・チーム役員エリア)">Level 2 (選手・チーム役員エリア / Athletes & Team Leaders)</option>
            <option value="Level 3 (IF/AF 役員・VIPエリア)">Level 3 (IF/AF 役員・VIPエリア / IF & AF Family)</option>
            <option value="Level 4 (報道・プレスエリア)">Level 4 (報道・プレスエリア / Press & Photographers)</option>
            <option value="Level 5 (放送・HB/RHBエリア)">Level 5 (放送・HB/RHBエリア / Broadcasters & HB)</option>
            <option value="Level 6 (大会運営・スタッフエリア)">Level 6 (大会運営・スタッフエリア / Workforce & Staff)</option>
            <option value="Level RED (レッドゾーン / 競技専用)">Level RED (レッドゾーン / Secure Operations)</option>
            <option value="Level BLUE (ブルーゾーン / 選手動線)">Level BLUE (ブルーゾーン / Athlete Warm-up)</option>
            <option value="Level WHITE (ホワイトゾーン / 運営・車両)">Level WHITE (ホワイトゾーン / Compound & Logistics)</option>
            <option value="Level FOH (観客・一般エリア)">Level FOH (観客・一般エリア / Front of House)</option>
            <option value="Level SACD (特別通行証・SACDs)">Level SACD (特別通行証 / Special Access)</option>
            <option value="ALL (全エリア無制限)">ALL (全エリアアクセス可 / All Access)</option>
            <option value="custom">✏️ カスタム入力（手動指定）</option>
          </select>
          <input type="text" id="form-acp" placeholder="例: Level A (選手・役員), または ACP-1F-01" style="margin-top:6px; display:none;">
        </div>

        <div class="form-group">
          <label for="form-pdf">📄 関連PDF資料・マニュアル (任意):</label>
          <input type="text" id="form-pdf" placeholder="例: assets/docs/manual.pdf または PDFファイル名">
        </div>

        <div class="form-group">
          <label for="form-desc">概要・説明:</label>
          <textarea id="form-desc" rows="2" placeholder="特記事項・運用仕様を入力..."></textarea>
        </div>

        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px;">
          <button type="button" id="form-delete-btn" class="btn-secondary" style="background:#ef4444; color:#fff; display:none;">🗑️ 削除</button>
          <div style="display:flex; gap:8px; margin-left:auto;">
            <button type="button" id="form-cancel-btn" class="btn-secondary">キャンセル</button>
            <button type="submit" class="btn-primary">💾 保存</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- モーダル2: データ保存・出力 -->
  <div id="export-modal" class="modal-backdrop">
    <div class="modal-card">
      <div class="modal-header">
        <h3 style="margin:0; font-size:16px;">💾 データ保存・出力</h3>
        <button id="export-close-btn" class="modal-close">✕</button>
      </div>
      <div style="display:flex; flex-direction:column; gap:12px; margin-top:12px; font-size:13px; color:var(--text-secondary);">
        <div id="export-stats" style="font-size:12px; padding:8px 10px; background:rgba(255,255,255,0.05); border-radius:6px; border:1px solid rgba(255,255,255,0.1); color:var(--text-primary); line-height:1.6;">
          編集した最新データはブラウザに自動保存されています。
        </div>

        <div>
          別の端末やファイル本体へ反映する場合は、最新の <code style="color:var(--text-primary);">data.js</code> をダウンロードして上書き配置できます。
        </div>

        <button id="download-datajs-btn" class="btn-primary" style="padding:10px; font-size:13px; cursor:pointer;">
          📄 最新マスターデータを js/data.js としてダウンロード
        </button>

        <button id="copy-datajs-btn" class="btn-secondary" style="padding:10px; font-size:13px; cursor:pointer;">
          📋 クリップボードに最新データをコピー
        </button>

        <!-- セキュリティ制限環境向け：テキスト直接表示枠 -->
        <div style="margin-top:4px;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
            <span style="font-size:11px; color:#94a3b8;">📝 データ直接表示（コピー＆ペースト用）:</span>
            <button id="select-all-text-btn" type="button" class="btn-secondary" style="padding:2px 8px; font-size:11px; cursor:pointer;">
              全選択
            </button>
          </div>
          <textarea id="export-textarea" readonly style="width:100%; height:90px; font-family:monospace; font-size:11px; padding:6px; background:rgba(0,0,0,0.4); border:1px solid rgba(255,255,255,0.15); border-radius:6px; color:#cbd5e1; resize:vertical; box-sizing:border-box;"></textarea>
        </div>

        <hr style="border:0; border-top:1px solid rgba(255,255,255,0.1); margin:4px 0;">

        <button id="reset-default-data-btn" class="btn-secondary" style="color:#ef4444; border-color:#ef4444; padding:10px; font-size:13px; cursor:pointer;">
          🔄 初期データ状態にリセット（保存キャッシュ消去）
        </button>
      </div>
    </div>
  </div>

  <!-- スクリプト読み込み (重要: data.js -> map-engine.js -> app.js) -->
  <script src="js/data.js?v=21.0"></script>
  <script src="js/map-engine.js?v=21.0"></script>
  <script src="js/app.js?v=21.0"></script>
</body>
</html>
